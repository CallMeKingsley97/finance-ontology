[project]
name = "finance-ontology-mvp-backend"
version = "0.1.0"
description = "企业财务 Ontology Agent MVP 后端（FastAPI + SQLite）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "PyMySQL>=1.1.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.12",
    "cryptography>=43.0.0",
    "charset-normalizer>=3.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
